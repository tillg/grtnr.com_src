name: Test Production Site

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual triggers

jobs:
  check-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .devcontainer/requirements.txt

      - name: Build site to discover all pages
        env:
          GARTEN_TRANSLATION__ENABLED: "false"
        run: inv build

      - name: Extract page URLs
        run: |
          # Find all HTML files in output, convert paths to live URLs
          find ./output -name "*.html" -type f \
            | sed 's|^\./output|https://grtnr.com|' \
            | sort > /tmp/urls.txt
          echo "Found $(wc -l < /tmp/urls.txt) pages to check"

      - name: Check production links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --format markdown --output /tmp/lychee-report.md /tmp/urls.txt
          fail: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: /tmp/lychee-report.md
