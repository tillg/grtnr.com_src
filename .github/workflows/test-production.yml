name: Test Production Site

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual triggers

jobs:
  check-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Fetch sitemap and extract URLs
        run: |
          curl -sS https://grtnr.com/sitemap.xml \
            | grep -oP '<loc>\K[^<]+' \
            | sort > /tmp/urls.txt
          echo "Found $(wc -l < /tmp/urls.txt) URLs from sitemap"
          head -10 /tmp/urls.txt

      - name: Check production links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --format markdown /tmp/urls.txt
          fail: true
