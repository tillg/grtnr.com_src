name: Test Production Site

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual triggers

jobs:
  check-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Install lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --help
          fail: false

      - name: Fetch sitemap and build URL list
        run: |
          curl -sS https://grtnr.com/sitemap.xml \
            | grep -oP '<loc>\K[^<]+' \
            | sed 's|^/|https://grtnr.com/|' \
            | sort > /tmp/urls.txt
          echo "Found $(wc -l < /tmp/urls.txt) URLs from sitemap"
          head -5 /tmp/urls.txt

      - name: Check all links on production pages
        run: |
          lychee --config lychee.toml --format markdown \
            --output /tmp/lychee-report.md \
            $(cat /tmp/urls.txt | tr '\n' ' ')

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: /tmp/lychee-report.md
