name: Test Production Site

on:
  schedule:
    # Run weekly on Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: # Allow manual triggers

jobs:
  check-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Install lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --help
          fail: false

      - name: Fetch sitemap and build URL list
        run: |
          curl -sS https://grtnr.com/sitemap.xml \
            | grep -oP '<loc>\K[^<]+' \
            | sed 's|^/|https://grtnr.com/|' \
            | sort > /tmp/urls.txt
          echo "Found $(wc -l < /tmp/urls.txt) URLs from sitemap"
          head -5 /tmp/urls.txt

      - name: Check all links on production pages
        id: lychee
        continue-on-error: true
        run: |
          lychee --config lychee.toml --format markdown \
            --output /tmp/lychee-report.md \
            $(cat /tmp/urls.txt | tr '\n' ' ')

      - name: Generate report table
        if: always()
        run: |
          python3 << 'PYEOF'
          import re

          with open("/tmp/lychee-report.md") as f:
              raw = f.read()

          lines = raw.splitlines()

          # Extract summary section (everything up to "## Errors per input")
          summary_lines = []
          for line in lines:
              if line.startswith("## Errors per input"):
                  break
              summary_lines.append(line)
          summary = "\n".join(summary_lines).strip()

          # Parse errors: "### Errors in <URL>" followed by "* ..." bullets
          errors = []
          current_page = None
          for line in lines:
              header = re.match(r"^### Errors in (.+)$", line)
              if header:
                  current_page = header.group(1)
                  continue
              if current_page and line.startswith("* "):
                  error_text = line[2:].strip()
                  # Extract status and broken URL for a cleaner display
                  m = re.match(r"\[(\w+)\]\s*<([^>]+)>", error_text)
                  if m:
                      status, broken_url = m.group(1), m.group(2)
                      error_text = f"[{status}] {broken_url}"
                  errors.append((current_page, error_text))

          # Map status codes to human-readable explanations
          STATUS_DETAILS = {
              "400": "Bad Request — server rejected the request",
              "401": "Unauthorized — requires authentication",
              "403": "Forbidden — site blocks automated crawlers",
              "404": "Not Found — page no longer exists",
              "410": "Gone — page was permanently removed",
              "429": "Rate Limited — site throttles bot traffic (page likely fine)",
              "500": "Server Error — remote server problem",
              "502": "Bad Gateway — upstream server error",
              "503": "Service Unavailable — server temporarily down",
              "522": "Connection Timed Out — server did not respond (Cloudflare)",
              "ERROR": "Network/DNS failure — could not connect to server",
          }

          def get_details(error_text):
              m2 = re.match(r"\[(\w+)\]", error_text)
              if m2:
                  code = m2.group(1)
                  return STATUS_DETAILS.get(code, f"HTTP {code}")
              return ""

          # Build output
          out = [summary, ""]

          if errors:
              out.append("## Broken Links")
              out.append("")
              out.append("| Page | Error | Details |")
              out.append("|------|-------|---------|")
              for page, error in errors:
                  slug = page.rstrip("/").split("/")[-1]
                  page_link = f"[{slug}]({page})"
                  # Escape pipes in error text
                  error_safe = error.replace("|", "\\|")
                  details = get_details(error)
                  out.append(f"| {page_link} | {error_safe} | {details} |")
          else:
              out.append("## No broken links found!")

          out.append("")

          with open("/tmp/lychee-table.md", "w") as f:
              f.write("\n".join(out))

          print("\n".join(out))

          # Write to GitHub Actions Job Summary
          import os
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write("\n".join(out))
          PYEOF

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: |
            /tmp/lychee-table.md
            /tmp/lychee-report.md

      - name: Fail if broken links found
        if: steps.lychee.outcome == 'failure'
        run: exit 1
