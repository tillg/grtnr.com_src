name: Build and Deploy Pelican Site

on:
  push:
    branches:
      - main
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .devcontainer/requirements.txt

      - name: Cache translations
        uses: actions/cache@v3
        with:
          path: cache/translations
          key: translations-${{ hashFiles('content/**/*.md', 'extensions/translation_service/**/*.py') }}-v2
          restore-keys: |
            translations-${{ hashFiles('content/**/*.md', 'extensions/translation_service/**/*.py') }}-
            translations-v2-
            translations-

      - name: Set site name based on branch
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "PELICAN_SITENAME=grtnr.com" >> $GITHUB_ENV
          else
            echo "PELICAN_SITENAME=test.grtnr.com" >> $GITHUB_ENV
          fi

      - name: Configure translation service
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV
          echo "TRANSLATION_CACHE_ENABLED=true" >> $GITHUB_ENV
          echo "TRANSLATION_MAX_RETRIES=5" >> $GITHUB_ENV
          echo "TRANSLATION_TIMEOUT=60" >> $GITHUB_ENV
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Production: Full translation
            echo "TRANSLATION_ENABLED=true" >> $GITHUB_ENV
            echo "TRANSLATION_TARGET_LANGUAGES=de,fr,es" >> $GITHUB_ENV
            echo "TRANSLATION_MODEL=gpt-4o" >> $GITHUB_ENV
            echo "TRANSLATION_EXCLUDE_CATEGORIES=recipes" >> $GITHUB_ENV
          else
            # Test/staging: Limited translation to save costs
            echo "TRANSLATION_ENABLED=true" >> $GITHUB_ENV
            echo "TRANSLATION_TARGET_LANGUAGES=de" >> $GITHUB_ENV
            echo "TRANSLATION_MODEL=gpt-4o" >> $GITHUB_ENV
            echo "TRANSLATION_EXCLUDE_CATEGORIES=recipes,drafts" >> $GITHUB_ENV
          fi

      - name: Debug translation configuration
        run: |
          echo "🔍 Translation Debug Information:"
          echo "TRANSLATION_ENABLED=$TRANSLATION_ENABLED"
          echo "TRANSLATION_TARGET_LANGUAGES=$TRANSLATION_TARGET_LANGUAGES"
          echo "OPENAI_API_KEY set: $(if [ -n "$OPENAI_API_KEY" ]; then echo 'Yes (***hidden***)'; else echo 'No'; fi)"
          echo "Python path:"
          python -c "import sys; print('\n'.join(sys.path))"
          echo "Translation service test:"
          python -c "
          import sys, os
          sys.path.insert(0, 'extensions')
          try:
              from translation_service import TranslationConfig
              config = TranslationConfig.from_environment()
              print(f'✅ Config loaded: {config}')
          except Exception as e:
              print(f'❌ Config failed: {e}')
              import traceback
              traceback.print_exc()
          "

      - name: Build site
        run: inv preview

      - name: Show translation statistics
        run: |
          echo "📊 Translation Statistics:"
          echo "Cache directory contents:"
          ls -la cache/ 2>/dev/null || echo "No cache directory found"
          if [ -d "cache/translations" ]; then
            ls -la cache/translations/
          else
            echo "No translations cache directory"
          fi
          echo "Content extensions directories:"
          find content -name "extensions" -type d 2>/dev/null || echo "No extensions directories found"
          echo "Generated translation files:"
          find content -name "*-[A-Z][A-Z].md" 2>/dev/null | head -10 || echo "No translation files found in content"
          echo "Build log for translation mentions:"
          echo "Checking for translation activity in recent output..."
          echo "Directory structure:"
          ls -la
        
      - name: Upload site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-output
          path: ./output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-output
          path: ./output
          
      - name: Deploy to grtnr.com
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEPLOYMENT_TOKEN }}
          publish_dir: ./output
          publish_branch: main
          external_repository: tillg/grtnr.com
          cname: grtnr.com
      
      - name: Deploy to test.grtnr.com
        if: github.ref != 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEPLOYMENT_TOKEN }}
          publish_dir: ./output
          publish_branch: main
          external_repository: tillg/test.grtnr.com
          cname: test.grtnr.com