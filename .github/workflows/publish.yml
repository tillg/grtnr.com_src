name: Build and Deploy Site

on:
  push:
    branches:
      - main
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.DEPLOYMENT_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .devcontainer/requirements.txt

      - name: Install lychee link checker
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv lychee /usr/local/bin/
          lychee --version

      - name: Set site name based on branch
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "GARTEN_SITENAME=grtnr.com" >> $GITHUB_ENV
          else
            echo "GARTEN_SITENAME=test.grtnr.com" >> $GITHUB_ENV
          fi

      - name: Configure translation service
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV
          echo "TRANSLATION_CACHE_ENABLED=true" >> $GITHUB_ENV
          echo "TRANSLATION_MAX_RETRIES=5" >> $GITHUB_ENV
          echo "TRANSLATION_TIMEOUT=60" >> $GITHUB_ENV
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Production: Full translation
            echo "GARTEN_TRANSLATION__ENABLED=true" >> $GITHUB_ENV
            echo "TRANSLATION_ENABLED=true" >> $GITHUB_ENV
            echo "TRANSLATION_TARGET_LANGUAGES=en,de,fr" >> $GITHUB_ENV
            echo "TRANSLATION_MODEL=gpt-4o" >> $GITHUB_ENV
            echo "TRANSLATION_EXCLUDE_CATEGORIES=recipes" >> $GITHUB_ENV
          else
            # Test/staging: Limited translation to save costs
            echo "GARTEN_TRANSLATION__ENABLED=true" >> $GITHUB_ENV
            echo "TRANSLATION_ENABLED=true" >> $GITHUB_ENV
            echo "TRANSLATION_TARGET_LANGUAGES=de" >> $GITHUB_ENV
            echo "TRANSLATION_MODEL=gpt-4o" >> $GITHUB_ENV
            echo "TRANSLATION_EXCLUDE_CATEGORIES=recipes,drafts" >> $GITHUB_ENV
          fi

      - name: Debug translation configuration
        run: |
          echo "Translation Debug Information:"
          echo "GARTEN_TRANSLATION__ENABLED=$GARTEN_TRANSLATION__ENABLED"
          echo "TRANSLATION_ENABLED=$TRANSLATION_ENABLED"
          echo "TRANSLATION_TARGET_LANGUAGES=$TRANSLATION_TARGET_LANGUAGES"
          echo "OPENAI_API_KEY set: $(if [ -n "$OPENAI_API_KEY" ]; then echo 'Yes (***hidden***)'; else echo 'No'; fi)"
          echo "Translation service test:"
          python -c "
          import sys, os
          sys.path.insert(0, 'extensions')
          try:
              from translation_service import TranslationConfig
              config = TranslationConfig.from_environment()
              print(f'Config loaded: {config}')
          except Exception as e:
              print(f'Config failed: {e}')
              import traceback
              traceback.print_exc()
          "

      - name: Generate translations
        run: inv translate

      - name: Commit translations back to repo
        if: github.ref == 'refs/heads/main'
        run: |
          # Check if there are any new or modified translation files
          TRANSLATION_FILES=$(find content -path "*/extensions/*-[A-Z][A-Z].md" -type f 2>/dev/null || true)

          if [ -z "$TRANSLATION_FILES" ]; then
            echo "No translation files found"
            exit 0
          fi

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add all translation files
          git add content/**/extensions/*-[A-Z][A-Z].md 2>/dev/null || true

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new translations to commit"
          else
            echo "Committing new translations..."
            git commit -m "Add auto-generated translations [skip ci]"
            git push
            echo "Translations committed and pushed"
          fi

      - name: Build site
        run: inv build

      - name: Upload site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-output
          path: ./output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-output
          path: ./output

      - name: Deploy to grtnr.com
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEPLOYMENT_TOKEN }}
          publish_dir: ./output
          publish_branch: main
          external_repository: tillg/grtnr.com
          cname: grtnr.com

      - name: Deploy to test.grtnr.com
        if: github.ref != 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEPLOYMENT_TOKEN }}
          publish_dir: ./output
          publish_branch: main
          external_repository: tillg/test.grtnr.com
          cname: test.grtnr.com
