<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" rx="24" fill="#1a1a2e"/>
  <!-- Disk icon -->
  <g transform="translate(300,80)">
    <rect x="20" y="20" width="160" height="120" rx="12" fill="#16213e" stroke="#0f3460" stroke-width="3"/>
    <rect x="40" y="40" width="120" height="80" rx="4" fill="#0f3460"/>
    <circle cx="100" cy="80" r="25" fill="#e94560" opacity="0.8"/>
    <circle cx="100" cy="80" r="10" fill="#1a1a2e"/>
    <rect x="140" y="110" width="15" height="6" rx="2" fill="#53354a"/>
  </g>
  <!-- Chart bars representing disk usage over time -->
  <g transform="translate(100,260)">
    <!-- Axis -->
    <line x1="50" y1="0" x2="50" y2="180" stroke="#0f3460" stroke-width="2"/>
    <line x1="50" y1="180" x2="650" y2="180" stroke="#0f3460" stroke-width="2"/>
    <!-- Bars growing over time -->
    <rect x="80" y="140" width="40" height="40" rx="4" fill="#0f3460" opacity="0.6"/>
    <rect x="140" y="120" width="40" height="60" rx="4" fill="#0f3460" opacity="0.7"/>
    <rect x="200" y="100" width="40" height="80" rx="4" fill="#16213e" opacity="0.8"/>
    <rect x="260" y="90" width="40" height="90" rx="4" fill="#16213e" opacity="0.85"/>
    <rect x="320" y="70" width="40" height="110" rx="4" fill="#53354a" opacity="0.8"/>
    <rect x="380" y="50" width="40" height="130" rx="4" fill="#53354a" opacity="0.85"/>
    <rect x="440" y="30" width="40" height="150" rx="4" fill="#e94560" opacity="0.7"/>
    <rect x="500" y="10" width="40" height="170" rx="4" fill="#e94560" opacity="0.85"/>
    <rect x="560" y="0" width="40" height="180" rx="4" fill="#e94560"/>
    <!-- Trend line -->
    <polyline points="100,140 160,120 220,100 280,90 340,70 400,50 460,30 520,10 580,0"
              stroke="#e94560" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.5"/>
    <!-- Labels -->
    <text x="100" y="200" fill="#535353" font-family="monospace" font-size="11" text-anchor="middle">Jan</text>
    <text x="220" y="200" fill="#535353" font-family="monospace" font-size="11" text-anchor="middle">Mar</text>
    <text x="340" y="200" fill="#535353" font-family="monospace" font-size="11" text-anchor="middle">May</text>
    <text x="460" y="200" fill="#535353" font-family="monospace" font-size="11" text-anchor="middle">Jul</text>
    <text x="580" y="200" fill="#535353" font-family="monospace" font-size="11" text-anchor="middle">Sep</text>
  </g>
</svg>
