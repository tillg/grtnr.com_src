# lychee link checker configuration
# https://github.com/lycheeverse/lychee

# Timeout per request in seconds
timeout = 30

# Maximum number of retries per request
max_retries = 3

# Maximum number of concurrent requests
max_concurrency = 16

# User agent string
user_agent = "Mozilla/5.0 (compatible; lychee-link-checker)"

# Accept these status codes as valid (202 = Accepted, used by some sites)
accept = [200, 202, 204, 301, 302, 307, 308]

# Exclude URLs matching these patterns
exclude = [
    # Crawler-hostile sites
    "https://www.linkedin.com/.*",
    "https://linkedin.com/.*",
    "https://x.com/.*",
    "https://twitter.com/.*",
    "https://goo.gl/.*",
    "https://www.godaddy.com/.*",
    # Pre-existing broken WikiLink in About page (links to non-existent /todo/)
    ".*/todo$",
]

# Don't check email addresses
include_mail = false
