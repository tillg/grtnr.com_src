# lychee link checker configuration
# https://github.com/lycheeverse/lychee

# Timeout per request in seconds
timeout = 30

# Maximum number of retries per request
max_retries = 3

# Maximum number of concurrent requests
max_concurrency = 16

# User agent string
user_agent = "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Safari/605.1.15"

# Accept these status codes as valid (202 = Accepted, used by some sites;
# 403 = Forbidden, typically means bot-blocked but site is alive)
accept = [200, 202, 204, 301, 302, 307, 308, 403]

# Exclude URLs matching these patterns
exclude = [
    # Crawler-hostile sites that block even with 403 acceptance
    "https://www.linkedin.com/.*",
    "https://linkedin.com/.*",
    "https://x.com/.*",
    "https://twitter.com/.*",
    "https://goo.gl/.*",
    "https://www.godaddy.com/.*",
    # Instagram and Adobe return 429/HTTP2 errors to bots but links are valid
    "https://www.instagram.com/.*",
    "https://www.adobe.com/.*",
    # Tom's Planner SSL cert not trusted by lychee but site is alive
    "https://www.tomsplanner.com/.*",
    # Defunct personal site referenced in old articles
    "https?://tillgartner\\.com.*",
    # Defunct external services referenced in old articles (2013–2016)
    "https://app.everviz.com/.*",
    "http://map1.maploco.com/.*",
    "http://www.medienvilla.com/.*",
    "http://www.danangexperience.com/.*",
    "https://www.muenchen.de/rathaus/Stadtinfos/Rundgang-durch-das-Neue-Rathaus/.*",
    # SWM pool occupancy page: alive from Germany, times out from CI runners
    "https://www.swm.de/baeder/auslastung.*",
    # Pre-existing broken WikiLink in About page (links to non-existent /todo/)
    ".*/todo$",
]

# Don't check email addresses
include_mail = false

# Exclude paths from checking
exclude_path = ["output/pagefind"]
